name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Visual Studio 2026 (premake's vs2026, toolset v145), as the fixes' own workflows
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Release, Debug ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Fetch test dependencies
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\fetch-test-deps.ps1

    - name: Configure build
      run: ./premake5 vs2026

    # Every header compiled on its own (build/standalone, generated by premake5.lua from all headers), both platforms
    - name: Standalone headers
      run: |
        msbuild -m build/StandaloneHeaders.vcxproj /property:Configuration=${{ matrix.configuration }} /property:Platform=Win32
        msbuild -m build/StandaloneHeaders.vcxproj /property:Configuration=${{ matrix.configuration }} /property:Platform=x64

    - name: Build Win32
      run: msbuild -m build/FusionFixUtils.slnx /property:Configuration=${{ matrix.configuration }} /property:Platform=Win32

    - name: Build x64
      run: msbuild -m build/FusionFixUtils.slnx /property:Configuration=${{ matrix.configuration }} /property:Platform=x64

    # Both platforms are built before the tests: the x86 tests also talk to the x64 fake hub (and the other way round)
    - name: Test Win32
      shell: cmd
      run: tools\run-tests.bat ${{ matrix.configuration }} Win32

    - name: Test x64
      shell: cmd
      run: tools\run-tests.bat ${{ matrix.configuration }} x64
